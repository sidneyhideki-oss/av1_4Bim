<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#176b4d" />
    <meta name="description" content="Faça seu cadastro com a Marketon de forma rápida e segura." />
    <title>Cadastro | Marketon</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../style/style.css" />

  </head>
  <body>
    <nav class="navbar navbar-expand-md bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="index.html">Marketon</a>

        <div class="navbar-nav">
          <a class="nav-link active" aria-current="page" href="index.html">Cadastro</a>
          <a class="nav-link" href="formulario.html">Serviços online</a>
        </div>
      </div>
    </nav>
    <main class="container">
      <header class="page-intro">
        <span class="eyebrow">Bem-vindo à Marketon</span>
        <h1 id="titulo">Um cadastro simples.<br />Um atendimento melhor.</h1>
        <p>Preencha seus dados para agilizar seu atendimento. Suas informações ficam salvas apenas neste navegador.</p>
      </header>

      <section class="content-card" aria-labelledby="titulo">
        <div class="card-body">
          <form id="formulario">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="nome" class="form-label">Nome completo</label>
                <input type="text" id="nome" name="nome" class="form-control" autocomplete="name" placeholder="Ex.: Ana Silva" required />
              </div>
              <div class="col-12 col-md-6">
                <label for="idade" class="form-label">Idade</label>
                <input type="number" id="idade" name="idade" class="form-control" min="1" max="120" placeholder="Sua idade" required />
              </div>
              <div class="col-12 col-md-6">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" name="email" class="form-control" autocomplete="email" placeholder="voce@exemplo.com" required />
              </div>
              <div class="col-12 col-md-6">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="tel" id="telefone" name="telefone" class="form-control" autocomplete="tel" placeholder="(11) 99999-9999" required />
              </div>
            </div>
            <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
              <button id="botao" type="submit" class="btn btn-primary px-4">Salvar cadastro</button>
              <button id="apagar-dados" type="button" class="btn btn-outline-danger px-4">Apagar dados salvos</button>
            </div>
          </form>
          <p id="resultado" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></p>
          <div class="feature-note"><span aria-hidden="true">🔒</span><span><strong>Seus dados são privados.</strong> Este formulário usa o armazenamento local do seu navegador.</span></div>
        </div>
      </section>
    </main>

            <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
    ></script>
    <script src="../js/script.js"></script>
  </body>
</html>
