<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introdução Javascript</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

  </head>
  <body>
    <nav class="navbar navbar-expand-md bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="index.html">Marketon</a>

        <div class="navbar-nav">
          <a class="nav-link" href="index.html">Cadastro</a>
          <a class="nav-link" href="formulario.html">Serviços online</a>
        </div>
      </div>
    </nav>
    <main class="container mt-5">
      <h1 id="titulo">Formulário do usuário</h1>
      <form id="formulario">
        <div class="mb-3">
          <label for="nome" class="form-label"> Nome: </label>

          <input type="text" id="nome" class="form-control" required />
        </div>

        <div class="mb-3">
          <label for="idade" class="form-label"> Idade: </label>
          <input type="number" id="idade" class="form-control" min="1" max="120" required />
          
        </div>  
            <div class="mb-3">
            <label for="email" class="form-label"> Email: </label>
          <input type="email" id="email" class="form-control" required />
          </div>
          
          
          <div class="mb-3">
            <label for="telefone" class="form-label"> Telefone: </label>
          <input type="tel" id="telefone" class="form-control" required />
          </div>  


            
        <button id="botao" type="submit" class="btn btn-primary">
          Verificar
        </button>
      </form>

      <p id="resultado" class="alert d-none mt-3" role="status" aria-live="polite"></p>
      <p class="form-text mt-3">O cadastro mais recente fica salvo somente neste navegador.</p>
      <button id="apagar-dados" type="button" class="btn btn-outline-danger btn-sm mt-2">
        Apagar dados salvos
      </button>
    </main>

            <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
    ></script>
    <script src="../js/script.js"></script>
  </body>
</html>
